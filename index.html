<!doctype html>
<html lang="%LANG%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%%PREFIX%/" />
    <!--
      Dve jazykove verze na dvou adresach. Aplikace hrefy prepisuje podle
      vypisu, aby ukazovaly na dvojce te same stranky, ne na homepage.
    -->
    <link rel="alternate" hreflang="cs" href="%SITE_URL%/" />
    <link rel="alternate" hreflang="en" href="%SITE_URL%/en/" />
    <link rel="alternate" hreflang="x-default" href="%SITE_URL%/" />
    <!-- Aplikace to prepina: vysledky hledani si nastavi `noindex`. -->
    <meta name="robots" content="index, follow" />

    <!-- Obaly her jdou z cizi domeny; bez tohohle resi prohlizec DNS, TCP
         a TLS teprve u prvniho obrazku. -->
    <link rel="preconnect" href="https://images.igdb.com" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#863bff" />

    <!-- Nahled odkazu na socialnich sitich a v Slacku. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND%" />
    <meta property="og:locale" content="%OG_LOCALE%" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%%PREFIX%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Rezim nastavime jeste pred prvnim vykreslenim, jinak by u lidi se svetlym
      systemem probliklo svetle pozadi, nez se rozjede React. Vychozi je noc.
    -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
      } catch (error) {
        saved = null;
      }
      document.documentElement.dataset.theme =
        saved === "light" ? "light" : "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
