[build]
  command = "npm run build"
  publish = "dist"

# Stara adresa nema zustat druhou indexovatelnou kopii webu. Netlify sam
# `netlify.app` nepresmerovava — ta adresa funguje vzdy, dokud to nerekneme
# takhle. `force` je nutne: bez nej se driv najde index.html a pravidlo se
# neuplatni. Deploy previews maji vlastni host, takze se jich to netkne.
[[redirects]]
  from = "https://next-games.netlify.app/*"
  to = "https://nextgames.eu/:splat"
  status = 301
  force = true

# Anglicka verze ma vlastni `index.html` s vlastni hlavickou, takze musi mit
# i vlastni fallback — jinak by `/en/?rok=2026` spadlo na ceskou stranku.
[[redirects]]
  from = "/en/*"
  to = "/en/index.html"
  status = 200

# SPA: vsechno ostatni obsluhuje index.html. Funkce se resi driv nez redirecty,
# takze `/api/games` sem nespadne.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
